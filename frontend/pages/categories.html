<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script src="../js/script.js"></script>

    <title>Categories - Expense Manager</title>
  </head>

  <body data-page="categories">
    <aside id="sidebar">
      <nav aria-label="Main navigation">
        <div class="logo">
          <span>Expense Manager</span>
        </div>

        <ul>
          <li><a href="../index.html">Dashboard</a></li>
          <li><a href="transactions.html">Transactions</a></li>
          <li><a href="categories.html" class="active">Categories</a></li>
          <li><a href="accounts.html">Accounts</a></li>
          <li><a href="analytics.html">Analytics</a></li>
          <li><a href="settings.html">Settings</a></li>
        </ul>
      </nav>
    </aside>

    <main>
      <header>
        <div class="header-title">
          <button
            type="button"
            class="menu-toggle"
            aria-label="Toggle menu"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            <i class="fa-solid fa-bars"></i>
          </button>

          <h1>Categories</h1>
        </div>

        <div class="navbar">
          <form aria-label="Search">
            <label for="navbar-search">Search:</label>

            <input
              type="search"
              id="navbar-search"
              name="search"
              placeholder="Search transactions..."
            />

            <button type="submit">Search</button>
          </form>

          <button
            type="button"
            class="notification-button"
            aria-label="Notifications"
          >
            <i class="fa-solid fa-bell"></i>
            <span class="notification-count" hidden></span>
          </button>

          <a href="settings.html">Settings</a>
        </div>
      </header>

      <section>
        <h2>Expense Categories</h2>

        <div class="card-container" id="expense-categories"></div>
      </section>

      <section>
        <h2>Income Categories</h2>

        <div class="card-container" id="income-categories"></div>
      </section>

      <section>
        <h2>Add Category</h2>

        <form class="add-category-form">
          <label for="category-name">Name:</label>

          <input
            type="text"
            id="category-name"
            name="category-name"
            maxlength="30"
            required
          />

          <label for="category-type">Type:</label>

          <select id="category-type" name="category-type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>

          <button type="submit">Add Category</button>

          <p class="form-message" role="status"></p>
        </form>
      </section>
    </main>
  </body>
</html>
