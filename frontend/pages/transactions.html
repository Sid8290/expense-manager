<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script src="../js/script.js"></script>

    <title>Transactions - Expense Manager</title>
  </head>

  <body data-page="transactions">
    <aside id="sidebar">
      <nav aria-label="Main navigation">
        <div class="logo">
          <span>Expense Manager</span>
        </div>

        <ul>
          <li><a href="../index.html">Dashboard</a></li>
          <li>
            <a href="transactions.html" class="active">Transactions</a>
          </li>
          <li><a href="categories.html">Categories</a></li>
          <li><a href="accounts.html">Accounts</a></li>
          <li><a href="analytics.html">Analytics</a></li>
          <li><a href="settings.html">Settings</a></li>
        </ul>
      </nav>
    </aside>

    <main>
      <header>
        <div class="header-title">
          <button
            type="button"
            class="menu-toggle"
            aria-label="Toggle menu"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            <i class="fa-solid fa-bars"></i>
          </button>

          <h1>Transactions</h1>
        </div>

        <div class="navbar">
          <form aria-label="Search">
            <label for="navbar-search">Search:</label>
            <input
              type="search"
              id="navbar-search"
              placeholder="Search transactions..."
            />
            <button type="submit">Search</button>
          </form>

          <button
            type="button"
            class="notification-button"
            aria-label="Notifications"
          >
            <i class="fa-solid fa-bell"></i>
            <span class="notification-count" hidden></span>
          </button>

          <a href="settings.html">Settings</a>
        </div>
      </header>

      <section>
        <h2>Filters</h2>

        <form class="transaction-filters-form">
          <label for="filter-search">Search:</label>
          <input
            type="search"
            id="filter-search"
            placeholder="Description, category, note..."
          />

          <label for="filter-type">Type:</label>
          <select id="filter-type">
            <option value="all">All</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>

          <label for="filter-category">Category:</label>
          <select id="filter-category">
            <option value="">All</option>
          </select>

          <label for="filter-account">Account:</label>
          <select id="filter-account">
            <option value="">All</option>
          </select>

          <button type="submit">Search</button>
          <button type="button" class="btn-secondary" id="filter-clear">
            Clear
          </button>
        </form>
      </section>

      <section>
        <h2>Add Transaction</h2>

        <form class="add-transaction-form">
          <label for="description">Description:</label>
          <input type="text" id="description" maxlength="100" required />

          <label for="transaction-type">Type:</label>
          <select id="transaction-type" required>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>

          <label for="transaction-category">Category:</label>
          <select id="transaction-category" required></select>

          <label for="account">Account:</label>
          <select id="account" required></select>

          <label for="amount">Amount:</label>
          <input
            type="number"
            id="amount"
            min="0.01"
            max="1000000000"
            step="0.01"
            required
          />

          <label for="transaction-date">Date:</label>
          <input type="date" id="transaction-date" required />

          <label for="note">Note:</label>
          <textarea
            id="note"
            maxlength="200"
            placeholder="Type your note here..."
          ></textarea>

          <button type="submit">Add Transaction</button>

          <p class="form-message" role="status"></p>
        </form>
      </section>

      <section>
        <h2>All Transactions</h2>

        <p class="table-summary" id="transaction-summary"></p>

        <div class="table-container">
          <table id="transactions-table">
            <thead>
              <tr>
                <th scope="col">Date</th>
                <th scope="col">Description</th>
                <th scope="col">Category</th>
                <th scope="col">Type</th>
                <th scope="col">Account</th>
                <th scope="col">Amount</th>
                <th scope="col">Note</th>
                <th scope="col">Action</th>
              </tr>
            </thead>

            <tbody id="transactions-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
